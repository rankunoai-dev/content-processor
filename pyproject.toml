[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "content-processor"
version = "0.1.0"
description = "Evidence-backed content extraction engine with honest completeness verification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Rankuno AI Automation Team" }]

dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "tenacity>=8.3",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "pytest-testmon>=2.1", "pytest-xdist>=3.5", "ruff>=0.5.0", "mypy>=1.10", "pre-commit>=3.7"]
browser = ["playwright>=1.44"]
docs = ["pymupdf>=1.24", "pypdf>=4.2", "pdfplumber>=0.11", "pytesseract>=0.3.10", "pillow>=10.3"]
unblock = ["curl_cffi>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "fixtures"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ANN", "S", "T20", "RET", "SIM", "C4", "D"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "D100", "D101", "D102", "D103", "D107", "ANN001", "ANN003", "ANN201", "ANN202"]
"fixtures/**" = ["S104", "D103"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests", "fixtures"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^build/", "^dist/"]
mypy_path = "."

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["selectolax.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: needs CP_DATABASE_URL (Postgres); skipped otherwise",
    "chaos: forced-failure tests against the ledger; needs CP_DATABASE_URL",
]

[tool.coverage.run]
source = ["src"]
branch = true
# ledger/tasks.py is exercised only by the integration suite (needs Postgres).
# Excluding it here is a documented, visible gap, closed by the CI Postgres job.
omit = ["src/modules/content_processor/ledger/tasks.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
