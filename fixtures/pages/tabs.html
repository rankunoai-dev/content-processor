<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Plans</title></head>
<body><main><h1>Plans</h1>
<div role="tablist">
<button role="tab" id="t1" aria-selected="true" aria-controls="p1">Monthly</button>
<button role="tab" id="t2" aria-selected="false" aria-controls="p2">Annual</button>
<button role="tab" id="t3" aria-selected="false" aria-controls="p3">Enterprise</button>
</div>
<div role="tabpanel" id="p1"><p>Monthly plan costs $12 per user.</p></div>
<div role="tabpanel" id="p2" hidden><p>Annual plan costs $120 per user, billed yearly.</p></div>
<div role="tabpanel" id="p3" hidden><p>Enterprise pricing requires a signed order form.</p></div>
</main>
<script>
document.querySelectorAll('[role=tab]').forEach(function (t) {
  t.addEventListener('click', function () {
    document.querySelectorAll('[role=tab]').forEach(function (x) { x.setAttribute('aria-selected', String(x === t)); });
    document.querySelectorAll('[role=tabpanel]').forEach(function (p) { p.hidden = p.id !== t.getAttribute('aria-controls'); });
  });
});
</script></body></html>
